name: Materialize portable source
on:
  push:
    branches: ['fix/standalone-seo-20260916']
    paths: ['_repair/portable.py', '.github/workflows/materialize-portable.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-analytics-data 'mcp>=2,<3'
      - run: python _repair/portable.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/seo_closure.py --json && python scripts/qualify_package.py
      - name: Commit materialized source
        env:
          REPAIR_BRANCH: ${{ github.ref_name }}
        run: |
          test "$REPAIR_BRANCH" = 'fix/standalone-seo-20260916'
          git config user.name 'SEO repair bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm _repair/portable.py .github/workflows/materialize-portable.yml
          git add scripts tests seo.py docs
          git commit -m 'fix: materialize portable UTF-8 and scoped operator reports'
          git push origin HEAD:"$REPAIR_BRANCH"
