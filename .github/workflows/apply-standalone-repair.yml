name: Apply reviewed standalone repair
on:
  push:
    branches: [seo/standalone-repair-20260916]
    paths: [.github/workflows/apply-standalone-repair.yml]
permissions:
  contents: write
concurrency:
  group: seo-standalone-source-repair
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/standalone-repair-20260916
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Orthic-Labs/legion
          ref: a4eaaa223c284ab81641c4283903648a2a8c1f14
          path: .historical-recovery
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover omitted assets and apply verified source edits
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, shutil
          from pathlib import Path
          root = Path.cwd().resolve()
          history = root / '.historical-recovery'
          for name in ('extensions', 'pdf'):
              assert not (root / name).exists(), f'unexpected existing {name}'
              shutil.copytree(history / 'skills' / 'seo' / name, root / name)
          assert not (root / 'LICENSE').exists(), 'unexpected existing license'
          shutil.copyfile(history / 'LICENSE', root / 'LICENSE')
          payload = ''.join((root / '.github' / 'repairs' / f'part{i}.b64').read_text(encoding='ascii').strip() for i in range(1, 5))
          data = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(data).hexdigest() == '9f44c6c02debc5ce42b24a1d1b8ce2f3d90d34397f0a14308ea4b665efa7849d', 'repair payload digest mismatch'
          operations = json.loads(data)
          assert len(operations) == 68
          for op in operations:
              rel = Path(op['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              path = (root / rel).resolve()
              assert path.is_relative_to(root) and not (root / rel).is_symlink()
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == op['old'], f'baseline changed: {rel}'
              if op.get('delete'):
                  path.unlink()
                  continue
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(op['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == op['new'], f'edited content mismatch: {rel}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          shutil.rmtree(history)
          shutil.rmtree(root / '.github' / 'repairs')
          for name in ('history-source.yml', 'apply-standalone-repair.yml'):
              (root / '.github' / 'workflows' / name).unlink()
          print('Applied 68 digest-verified edits and restored historical assets; transport removed.')
          PY
      - name: Qualify actual resulting source
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/seo-tests.log"
          python scripts/seo_closure.py --json | tee "$RUNNER_TEMP/seo-closure.json"
          python -m compileall -q scripts hooks extensions seo.py
          python seo.py --help
          git diff --check
      - name: Commit qualified standalone source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: restore and qualify independent SEO runtime and plugins"
          git push origin HEAD:refs/heads/seo/standalone-repair-20260916
          git rev-parse HEAD | tee "$RUNNER_TEMP/seo-commit.txt"
          git archive --format=zip --output="$RUNNER_TEMP/seo-repaired-source.zip" HEAD
      - name: Upload source and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-standalone-repair-evidence
          path: |
            ${{ runner.temp }}/seo-tests.log
            ${{ runner.temp }}/seo-closure.json
            ${{ runner.temp }}/seo-commit.txt
            ${{ runner.temp }}/seo-repaired-source.zip
          retention-days: 7
