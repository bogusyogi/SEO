name: SEO CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional API and MCP dependencies for integration tests
        run: python -m pip install 'google-api-python-client>=2.100,<3' 'google-auth>=2.20,<3' 'google-auth-httplib2>=0.2,<1' 'google-analytics-data>=0.18,<1' 'mcp>=2,<3'
      - name: Materialize pending source-only repair, when present
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          for name in ('integrate', 'finalize', 'quality'):
              path = Path('_repair') / (name + '.py')
              if path.exists(): subprocess.run([sys.executable, str(path)], check=True)
      - run: python -m compileall -q scripts hooks seo.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/seo_closure.py --json
      - run: python scripts/qualify_package.py
      - name: Minimal isolated environment without optional SDKs
        shell: python
        run: |
          import os, subprocess, tempfile, venv
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              venv.EnvBuilder(with_pip=False).create(root / 'venv')
              executable = root / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(executable), str(Path('scripts/qualify_package.py').resolve())], check=True, cwd=root)
  native-plugin:
    name: Native Claude plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate . --strict
