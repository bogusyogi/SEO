name: SEO CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Optional SDKs for integration tests
        run: python -m pip install 'google-api-python-client>=2.100,<3' 'google-auth>=2.20,<3' 'google-auth-httplib2>=0.2,<1' 'google-analytics-data>=0.18,<1' 'mcp>=2,<3'
      - run: python -m compileall -q scripts hooks seo.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/seo_closure.py --json
      - run: python scripts/qualify_package.py
      - name: Archived installation in a minimal environment without SDKs or Legion
        shell: python
        run: |
          import os, subprocess, tempfile, venv, zipfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              archive = root / 'seo.zip'
              subprocess.run(['git', 'archive', '--format=zip', '-o', str(archive), 'HEAD'], check=True)
              package = root / 'installed-seo'
              with zipfile.ZipFile(archive) as z:
                  z.extractall(package)
              assert not (package / '_repair').exists(), 'release contains temporary source generators'
              venv.EnvBuilder(with_pip=False).create(root / 'venv')
              executable = root / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(executable), str(package / 'scripts/qualify_package.py')], check=True, cwd=root)
  native-plugin:
    name: Native Claude plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@2.1.273
      - run: claude --version
      - run: claude plugin validate .claude-plugin/plugin.json --strict
      - run: claude plugin validate .claude-plugin/marketplace.json --strict
