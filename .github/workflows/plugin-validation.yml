name: Native plugin validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated host validator
        run: npm install --prefix "$RUNNER_TEMP/seo-plugin-validator" --no-audit --no-fund @anthropic-ai/claude-code
      - name: Record host version and validate package
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/seo-claude-config
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/seo-plugin-validator/node_modules/.bin/claude" --version
          "$RUNNER_TEMP/seo-plugin-validator/node_modules/.bin/claude" plugin validate . --strict
