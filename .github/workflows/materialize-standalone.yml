name: Materialize standalone repair
on:
  push:
    branches: ['fix/standalone-seo-20260916']
    paths: ['_repair/patch.py', '.github/workflows/materialize-standalone.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python _repair/patch.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit materialized source
        env:
          REPAIR_BRANCH: ${{ github.ref_name }}
        run: |
          test "$REPAIR_BRANCH" = 'fix/standalone-seo-20260916'
          git config user.name 'SEO repair bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm _repair/patch.py .github/workflows/materialize-standalone.yml
          git add scripts tests references config SKILL.md
          git commit -m 'fix: materialize standalone paths and analytics compatibility repairs'
          git push origin HEAD:"$REPAIR_BRANCH"
