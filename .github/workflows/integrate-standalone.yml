name: Integrate standalone repair
on:
  push:
    branches: ['fix/standalone-seo-20260916']
    paths: ['_repair/integrate.py', '.github/workflows/integrate-standalone.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-analytics-data
      - run: python _repair/integrate.py
      - run: python -m compileall -q scripts hooks seo.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/seo_closure.py --json
      - name: Commit qualified materialized source
        env:
          REPAIR_BRANCH: ${{ github.ref_name }}
        run: |
          test "$REPAIR_BRANCH" = 'fix/standalone-seo-20260916'
          git config user.name 'SEO repair bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm _repair/integrate.py .github/workflows/integrate-standalone.yml
          git add scripts tests references extensions pdf
          git commit -m 'fix: scope collection and qualify independent runtime integration'
          git push origin HEAD:"$REPAIR_BRANCH"
